name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  powerpc-guest-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerPC cross binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-powerpc-linux-gnu
      - name: Assemble and link freestanding diagnostic
        run: |
          mkdir -p build/diagnostics
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_mmio.o diagnostics/pci_mmio.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_mmio.elf build/diagnostics/pci_mmio.o
      - name: Build self-checking PowerPC diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_selfcheck.o diagnostics/pci_selfcheck.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_selfcheck.elf build/diagnostics/pci_selfcheck.o
      - name: Build guest PCI config bridge diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_config_bridge.o diagnostics/pci_config_bridge.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_config_bridge.elf build/diagnostics/pci_config_bridge.o
      - name: Build guest PCI scan diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_config_scan.o diagnostics/pci_config_scan.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_config_scan.elf build/diagnostics/pci_config_scan.o
      - name: Build guest PCI BAR sizing diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_bar_probe.o diagnostics/pci_bar_probe.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_bar_probe.elf build/diagnostics/pci_bar_probe.o
      - name: Build guest PCI decode and MMIO diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_enable_mmio.o diagnostics/pci_enable_mmio.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_enable_mmio.elf build/diagnostics/pci_enable_mmio.o
      - name: Build guest PCI decode toggle diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/pci_decode_toggle.o diagnostics/pci_decode_toggle.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/pci_decode_toggle.elf build/diagnostics/pci_decode_toggle.o
      - name: Build guest Discovery II PCI diagnostic
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/discovery_ii_pci.o diagnostics/discovery_ii_pci.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T diagnostics/pci_mmio.ld -o build/diagnostics/discovery_ii_pci.elf build/diagnostics/discovery_ii_pci.o
      - name: Assemble and link Discovery II IRQ guest fixture
        run: |
          powerpc-linux-gnu-as -mppc -o build/diagnostics/discovery_irq_guest.o tests/fixtures/discovery_irq_guest.S
          powerpc-linux-gnu-ld -m elf32ppclinux -T tests/fixtures/discovery_irq_guest.ld -o build/diagnostics/discovery_irq_guest.elf build/diagnostics/discovery_irq_guest.o
          powerpc-linux-gnu-readelf -h -l -s build/diagnostics/discovery_irq_guest.elf
          python3 -c 'from pathlib import Path; d=Path("build/diagnostics/discovery_irq_guest.elf").read_bytes(); assert d[:7]==bytes.fromhex("7f454c46010201"); assert int.from_bytes(d[18:20],"big")==20; assert int.from_bytes(d[24:28],"big")==0x1000'
      - name: Exercise PPCVM ELF command-line runner
        run: |
          cmake -S . -B build/cli-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/cli-host --target ppcvm --parallel
          build/cli-host/ppcvm --elf build/diagnostics/discovery_irq_guest.elf --ram 64 --steps 2
          if build/cli-host/ppcvm --elf build/diagnostics/discovery_irq_guest.elf --ram 64 --steps 2 --abi-v2; then
            echo "Unexpected ABI v2 success: boot record overlaps guest segment" >&2
            exit 1
          fi
      - name: Inspect PowerPC ELF loader metadata
        shell: bash
        run: |
          set -euo pipefail
          build/cli-host/ppcvm --elf build/diagnostics/discovery_irq_guest.elf --inspect-elf > build/cli-elf-inspect.log
          grep -q 'ELF32 PPC: type=2 entry=0x00001000' build/cli-elf-inspect.log
          grep -q '^LOAD ' build/cli-elf-inspect.log
          if build/cli-host/ppcvm --elf README.md --inspect-elf > build/cli-elf-invalid.log 2>&1; then
            echo "Non-ELF file unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'Not an ELF32 big-endian PowerPC image' build/cli-elf-invalid.log
      - name: Reject invalid PowerPC ELF entry points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          original = bytearray(Path("build/diagnostics/discovery_irq_guest.elf").read_bytes())
          entry = int.from_bytes(original[24:28], "big")
          assert entry == 0x1000
          for name, value in (("unaligned", entry + 2), ("outside", 0x7ffff000)):
              data = original.copy()
              data[24:28] = value.to_bytes(4, "big")
              Path("build/diagnostics/entry-" + name + ".elf").write_bytes(data)
          PY
          for name in unaligned outside; do
            if build/cli-host/ppcvm --elf "build/diagnostics/entry-$name.elf" --ram 64 --steps 1 > "build/entry-$name.log" 2>&1; then
              echo "Invalid ELF entry $name unexpectedly accepted" >&2
              exit 1
            fi
            grep -q 'is not aligned inside an executable LOAD segment' "build/entry-$name.log"
          done
      - name: Execute ELF with distinct virtual and physical load addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data = bytearray(Path("build/diagnostics/discovery_irq_guest.elf").read_bytes())
          phoff = int.from_bytes(data[28:32], "big")
          phsize = int.from_bytes(data[42:44], "big")
          phnum = int.from_bytes(data[44:46], "big")
          changed = 0
          for i in range(phnum):
              p = phoff + i * phsize
              if int.from_bytes(data[p:p+4], "big") != 1:
                  continue
              physical = int.from_bytes(data[p+12:p+16], "big")
              data[p+8:p+12] = (physical + 0x80000000).to_bytes(4, "big")
              changed += 1
          assert changed
          Path("build/diagnostics/physical-load.elf").write_bytes(data)
          PY
          build/cli-host/ppcvm --elf build/diagnostics/physical-load.elf --ram 64 --steps 2 > build/physical-load.log
          grep -q 'executed=2' build/physical-load.log
      - name: Verify CLI breakpoint and register diagnostics
        shell: bash
        run: |
          set -euo pipefail
          build/cli-host/ppcvm --elf build/diagnostics/discovery_irq_guest.elf --ram 64 --steps 10 --break-pc 0x1000 --dump-registers > build/cli-breakpoint.log 2>&1
          grep -q 'breakpoint: step=0 pc=0x00001000' build/cli-breakpoint.log
          grep -q 'executed=0, pc=0x00001000' build/cli-breakpoint.log
          grep -q 'r00=' build/cli-breakpoint.log
          build/cli-host/ppcvm --elf build/diagnostics/discovery_irq_guest.elf --ram 64 --steps 2 --trace --trace-limit 1 > build/cli-trace.log 2>&1
          grep -q 'step=0 pc=0x00001000' build/cli-trace.log
          if grep -q 'step=1 pc=' build/cli-trace.log; then
            echo "trace-limit emitted a second instruction" >&2
            exit 1
          fi
      - name: Run Discovery II IRQ ELF guest in PPCVM
        run: |
          cmake -S . -B build/irq-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/irq-host --target test_discovery_irq_elf --parallel
          build/irq-host/test_discovery_irq_elf build/diagnostics/discovery_irq_guest.elf
      - name: Configure and build PPCVM integration test
        run: |
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug -DPPCVM_PCI_SELFCHECK_ELF=${{ github.workspace }}/build/diagnostics/pci_selfcheck.elf -DPPCVM_PCI_CONFIG_GUEST_ELF=${{ github.workspace }}/build/diagnostics/pci_config_bridge.elf -DPPCVM_PCI_SCAN_GUEST_ELF=${{ github.workspace }}/build/diagnostics/pci_config_scan.elf -DPPCVM_PCI_BAR_PROBE_ELF=${{ github.workspace }}/build/diagnostics/pci_bar_probe.elf -DPPCVM_PCI_ENABLE_MMIO_ELF=${{ github.workspace }}/build/diagnostics/pci_enable_mmio.elf -DPPCVM_PCI_DECODE_TOGGLE_ELF=${{ github.workspace }}/build/diagnostics/pci_decode_toggle.elf -DPPCVM_DISCOVERY_II_GUEST_ELF=${{ github.workspace }}/build/diagnostics/discovery_ii_pci.elf
          cmake --build build/host --target test_pci_elf_diagnostic test_pci_selfcheck test_pci_config_bridge_guest test_pci_config_scan_guest test_pci_bar_probe_guest test_pci_enable_mmio_guest test_pci_decode_toggle_guest test_discovery_ii_guest --parallel
      - name: Execute cross-built ELF in PPCVM
        run: build/host/test_pci_elf_diagnostic build/diagnostics/pci_mmio.elf
      - name: Execute guest-side PCI self-check success and failure paths
        run: ctest --test-dir build/host -R pci_selfcheck_guest --output-on-failure
      - name: Execute PowerPC guest PCI config bridge probe
        run: ctest --test-dir build/host -R pci_config_bridge_guest --output-on-failure
      - name: Execute PowerPC guest PCI scan
        run: ctest --test-dir build/host -R pci_config_scan_guest --output-on-failure
      - name: Execute PowerPC guest PCI BAR sizing
        run: ctest --test-dir build/host -R pci_bar_probe_guest --output-on-failure
      - name: Execute PowerPC guest PCI Memory Decode and MMIO
        run: ctest --test-dir build/host -R pci_enable_mmio_guest --output-on-failure
      - name: Execute PowerPC guest PCI decode toggle
        run: ctest --test-dir build/host -R pci_decode_toggle_guest --output-on-failure
      - name: Execute PowerPC guest Discovery II PCI config probe
        run: ctest --test-dir build/host -R discovery_ii_guest --output-on-failure
      - name: Check ELF diagnostic entry and instruction bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('build/diagnostics/pci_mmio.elf').read_bytes()
          assert data[:7] == b'\x7fELF\x01\x02\x01'
          be16 = lambda n: int.from_bytes(data[n:n+2], 'big')
          be32 = lambda n: int.from_bytes(data[n:n+4], 'big')
          assert be16(16) == 2 and be16(18) == 20
          assert be32(24) == 0x100
          phoff, phsize, phnum = be32(28), be16(42), be16(44)
          assert phoff + phsize * phnum <= len(data)
          expected = [0x90830004, 0x80a30004, 0x60a60000, 0]
          found = False
          for i in range(phnum):
              p = phoff + i * phsize
              if be32(p) != 1:
                  continue
              offset, vaddr, filesz, flags = be32(p+4), be32(p+8), be32(p+16), be32(p+24)
              if not (flags & 1) or not (vaddr <= 0x100 and 0x110 <= vaddr + filesz):
                  continue
              start = offset + 0x100 - vaddr
              assert start + 16 <= len(data)
              words = [int.from_bytes(data[start+j:start+j+4], 'big') for j in range(0, 16, 4)]
              assert words == expected, (words, expected)
              found = True
          assert found, 'Missing executable PT_LOAD containing diagnostic entry'
          print('PowerPC ELF header, entry and instructions verified')
          PY
      - name: Upload PowerPC diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: ppcvm-powerpc-pci-diagnostic
          path: build/diagnostics/pci_mmio.elf
          if-no-files-found: error
      - name: Verify ELF and disassembly
        run: |
          powerpc-linux-gnu-readelf -h -l build/diagnostics/pci_mmio.elf
          powerpc-linux-gnu-objdump -d build/diagnostics/pci_mmio.elf
          test "$(powerpc-linux-gnu-readelf -h build/diagnostics/pci_mmio.elf | grep -c 'Machine:.*PowerPC')" -eq 1
